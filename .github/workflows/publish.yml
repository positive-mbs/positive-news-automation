name: Publish approved carousel
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: positive-news
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Publish to Meta
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          META_API_VERSION: v25.0
        run: python app.py publish
      - name: Save publication state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then git commit -m 'Record Instagram publication'; git push; fi
